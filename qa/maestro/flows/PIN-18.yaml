# Generated by gen/build.py from gen/flows_*.py - edit there, then re-run build.py
appId: ${APP_ID}
name: PIN-18
tags:
- p0
- pin
- lock
- settings
- known-fixed
properties:
  plan: 'PIN-18: Set a throwaway PIN, then remove it in the SAME Settings visit: pad opens on the first tap, one Back leaves Settings (crash guard for #440/#439)'
  expect: pass
  known: A midway failure leaves the app PIN-less or on the throwaway PIN; restore_baseline does not touch the PIN, so that state needs a manual fix
---
- runFlow: ../subflows/open_settings.yaml
- assertVisible:
    containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: true } }
    containsDescendants: [ { text: "User PIN code" } ]
    label: "User PIN code is on"

# baseline: fixture PIN on - remove it first
- tapOn: "User PIN code"
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Enter current pin code" }
    timeout: 15000
- runFlow: ../subflows/unlock.yaml
- extendedWaitUntil:
    visible:
      containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
      containsDescendants: [ { text: "User PIN code" } ]
    timeout: 180000
    label: "User PIN code turns off"

# throwaway set flow - its confirm tap is the crash site of #440
- evalScript:
    script: "${output.p2 = (String(MAESTRO_SENTINEL_PIN).indexOf('13579') === 0) ? '24680' : '13579'}"
    label: "Pick a 5-digit throwaway PIN (never the real one)"
- tapOn: "User PIN code"
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Enter new pin code" }
    timeout: 15000
- evalScript:
    script: ${output.k = 0}
    label: "reset key index"
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(output.p2).charAt(output.k)}
          label: "Throwaway PIN key"
      - evalScript:
          script: ${output.k = output.k + 1}
          label: "next key"
- tapOn: { id: "tconfirm", label: "Confirm the set pad" }
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Please Re-Enter Pin Code" }
    timeout: 15000
- evalScript:
    script: ${output.k = 0}
    label: "reset key index"
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(output.p2).charAt(output.k)}
          label: "Throwaway PIN key again"
      - evalScript:
          script: ${output.k = output.k + 1}
          label: "next key"
- tapOn: { id: "tconfirm", label: "Confirm the confirm pad (crash site of #440)" }
- extendedWaitUntil:
    notVisible: { id: "lockScreenText" }
    timeout: 15000
    label: "Both pads closed after the confirm (no #440 freeze)"
- extendedWaitUntil:
    visible:
      containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: true } }
      containsDescendants: [ { text: "User PIN code" } ]
    timeout: 180000
    label: "User PIN code turns on"

- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-18-set, optional: true } } ] }
# #433 core: toggle OFF in the SAME visit - the pad must open on the FIRST tap
- tapOn: "User PIN code"
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Enter current pin code" }
    timeout: 15000
    label: "Remove pad opens on the first tap (no ghost record)"
- evalScript:
    script: ${output.k = 0}
    label: "reset key index"
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(output.p2).charAt(output.k)}
          label: "Throwaway PIN key"
      - evalScript:
          script: ${output.k = output.k + 1}
          label: "next key"
- tapOn: { id: "tconfirm", label: "Confirm remove" }
- extendedWaitUntil:
    visible:
      containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: false } }
      containsDescendants: [ { text: "User PIN code" } ]
    timeout: 180000
    label: "User PIN code turns off"

- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-18-removed-same-visit, optional: true } } ] }
# the two-Back tell: ONE Back must leave Settings
- back
- extendedWaitUntil:
    visible: { id: "fab" }
    timeout: 30000
    label: "ONE Back press left Settings"
# restore the fixture PIN for the rest of the suite
- runFlow: ../subflows/open_settings.yaml
- tapOn: "User PIN code"
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Enter new pin code" }
    timeout: 15000
- evalScript:
    script: ${output.pinIdx = 0; output.pinLen = String(MAESTRO_SENTINEL_PIN).length}
    label: "Prepare fixture PIN entry"
- repeat:
    times: ${output.pinLen}
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(MAESTRO_SENTINEL_PIN).charAt(output.pinIdx)}
          label: "Fixture PIN key"
      - evalScript:
          script: ${output.pinIdx = output.pinIdx + 1}
          label: "Next PIN key"
- tapOn:
    id: "tconfirm"
    label: "Confirm the pad"
- extendedWaitUntil:
    visible: { id: "lockScreenText", text: "Please Re-Enter Pin Code" }
    timeout: 15000
    label: "Confirm pad up (restore)"
- evalScript:
    script: ${output.pinIdx = 0; output.pinLen = String(MAESTRO_SENTINEL_PIN).length}
    label: "Prepare fixture PIN entry"
- repeat:
    times: ${output.pinLen}
    commands:
      - tapOn:
          id: "t[a-j]"
          text: ${String(MAESTRO_SENTINEL_PIN).charAt(output.pinIdx)}
          label: "Fixture PIN key"
      - evalScript:
          script: ${output.pinIdx = output.pinIdx + 1}
          label: "Next PIN key"
- tapOn:
    id: "tconfirm"
    label: "Confirm the pad"
- extendedWaitUntil:
    visible:
      containsChild: { id: "android:id/widget_frame", containsChild: { id: "android:id/checkbox", checked: true } }
      containsDescendants: [ { text: "User PIN code" } ]
    timeout: 180000
    label: "User PIN code turns on"

- runFlow: { when: { notVisible: { id: "lockScreenText" } }, commands: [ { takeScreenshot: { path: PIN-18-restored, optional: true } } ] }
- runFlow: ../subflows/home_basic.yaml
